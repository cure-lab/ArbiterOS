agent_name: codex
depends_on_sidecar:
  enabled: false
upstream_compat:
  enabled: true
  rules:
    - match_model: "gpt-5.5"
      strip_metadata: true
      force_non_stream: true
      drop_tool_types:
        - image_generation
    - match_model: "gpt-5"
      strip_metadata: true
      drop_tool_types:
        - image_generation
