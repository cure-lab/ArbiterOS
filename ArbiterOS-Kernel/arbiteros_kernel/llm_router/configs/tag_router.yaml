tag_schema:
  is_multi_action:
    type: bool
    required: true
    description: User asks for 2+ distinct operations (e.g. cancel AND upgrade) in the same turn
  is_multi_reservation:
    type: bool
    required: true
    description: Two or more reservation IDs are explicitly mentioned in the prompt
  requires_policy_reasoning:
    type: bool
    required: true
    description: Prompt involves refund eligibility, insurance claims, medical/emergency exceptions, loyalty-status-based rules, compensation demands, or "I was told differently" disputes
  is_emotional_or_complaint:
    type: bool
    required: true
    description: User expresses frustration, anger, emotional distress, flattery to get special treatment, or explicitly demands escalation
  has_conditional_request:
    type: bool
    required: true
    description: User attaches preconditions (e.g. "only if I get a refund", "as long as it's under $100") rather than a straightforward action

candidate_models:
  - gpt-5
  - gpt-5-nano

model_costs:
  gpt-5: 10
  gpt-5-nano: 0.4

bayesian_bandit:
  prior_var: 1.0
  cost_weight: 0.1

database_path: tag_router_tau2_airline.json

tagger:
  model: gpt-4o
  api_base: ${OPENAI_API_BASE}
  api_key: ${OPENAI_API_KEY}
  temperature: 0.0
  max_tokens: 256
  strict_json: true
