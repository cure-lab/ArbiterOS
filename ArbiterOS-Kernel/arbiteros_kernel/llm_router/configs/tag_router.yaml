tag_schema:
  domain:
    type: enum
    required: true
    description: Request domain or topic category
    values:
    - code
    - math
    - reasoning
    - writing
    - vision
    - general
    - data
  complexity:
    type: enum
    required: true
    description: Task complexity level
    values:
    - low
    - medium
    - high
  language:
    type: string
    required: true
    description: Primary language of the request (e.g., 'english', 'chinese', 'mixed')
  requires_vision:
    type: bool
    required: false
    description: Whether the task involves images or visual content
  is_creative:
    type: bool
    required: false
    description: Whether the task requires creative thinking or generation
  requires_long_context:
    type: bool
    required: false
    description: Whether the task involves very long input/output
routing_matrix:
- condition: domain in [code, math, reasoning] AND complexity = high
  models:
  - claude-sonnet-4-6
  - deepseek-v3
  - gpt-4o
  metadata:
    description: Complex technical tasks
    priority: 10
  state:
    deepseek-v3:
      alpha: 7.0
      beta: 1.0
      total_cost: 0.014399200000000001
      total_requests: 6
      avg_cost: 0.002399866666666667
    gpt-4o:
      alpha: 6.0
      beta: 1.0
      total_cost: 0.0153925
      total_requests: 5
      avg_cost: 0.0030785
    last_updated: '2026-07-03T07:54:50.921370Z'
- condition: requires_vision = true
  models:
  - claude-sonnet-4-6
  - gpt-4o
  metadata:
    description: Vision understanding tasks
    priority: 9
- condition: requires_long_context = true
  models:
  - claude-sonnet-4-6
  - gemini-2.0-flash-exp
  metadata:
    description: Long context tasks
    priority: 8
- condition: domain = code AND complexity = medium
  models:
  - claude-sonnet-4-6
  - deepseek-v3
  - gpt-4o-mini
  metadata:
    description: Standard coding tasks
    priority: 5
- condition: complexity = low
