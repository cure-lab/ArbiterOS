# ArbiterOS kernel: which agent tool names to parse (instruction_parsing).
# Now support : openclaw, nanobot, hermes, codex, claude_code
# upstream_compat:
# enabled: true only for claude_code and codex
# enabled: false for openclaw, nanobot, and hermes
llm_routing:
  enabled: false
  strategy: tag_router

response_format:
  type: json_schema
  json_schema:
    name: instruction_output
    schema:
      type: object
      properties:
        topic:
          type: string
          description: "A concise topic/title for this turn (keep it short, e.g. 8-20 Chinese chars or <= 40 chars)."
          maxLength: 60
        category:
          type: string
          enum:
            - COGNITIVE_CORE__REASON
            - COGNITIVE_CORE__PLAN
            - COGNITIVE_CORE__CRITIQUE
            - COGNITIVE_CORE__ASK
            - COGNITIVE_CORE__RESPOND
          description: "The instruction category type. Use the most Accurate category possible, rather than only choose 'COGNITIVE_CORE__RESPOND'. "
        content:
          type: string
          description: "The actual content of the instruction. It can be anything and in any format you need to generate."
        depends_on:
          type: array
          items:
            type: object
            properties:
              instruction_id:
                type: string
                description: "Prior instruction id from an [ARBITEROS_REF ...] marker."
              confidence:
                type: number
                minimum: 0
                maximum: 1
                description: "How direct and necessary this causal link is (0-1)."
              counterfactual:
                type: string
                maxLength: 240
                description: "One short sentence: if that predecessor had not occurred or produced its output, how would this step likely change?"
            required:
              - instruction_id
              - confidence
              - counterfactual
            additionalProperties: false
          description: "Prior-step dependencies from [ARBITEROS_REF ...] markers; each entry needs instruction_id, confidence (0-1), and counterfactual. Use [] when none. Allowed ids for this turn appear in the trailing [arbiteros_turn_context] block."
      required:
        - topic
        - category
        - content
        - depends_on
      additionalProperties: false
    strict: true

arbiteros_local_policy_confirm: true
arbiteros_local_policy_confirm_test_mode: false
precall_log_enabled: true

# Prompt-cache stable prefix (kernel default ON): freeze tools/schema/instructions and append
# ephemeral [arbiteros_turn_context] at the end. Rollback: ARBITEROS_PROMPT_CACHE_STABLE_PREFIX=0

# Said/Done PreToolUse defender (Gateway pending + Codex hook match/escalate).
# true  => record TOOLCALLs and gate PreToolUse (auto-allow match, else watch).
# false => like before: no pending registration; hook auto-allows (no escalate).
# Env override: ARBITEROS_SAID_DONE_HOOK_ENABLED=0|1
said_done_hook_enabled: false

litellm_settings:
  drop_params: true
  callbacks: arbiteros_kernel.litellm_callback.proxy_handler_instance
  success_callback: ["mlflow"]
  failure_callback: ["mlflow"]

arbiteros_skill_trust:
  skills_root: /path/to/your/skills

skill_scanner_llm:
  model:
  api_base:
  api_key: os.environ/ARBITEROS_SKILL_SCANNER_API_KEY

session_bootstrap_scan:
  enabled: false
  protected_paths:
    - "PATH/TO/YOUR/SOUL.MD"
    - "PATH/TO/YOUR/AGENTS.MD"
    - "PATH/TO/YOUR/IDENTITY.MD"
  max_content_chars_per_file: 12000

taint_ablation:
  disable_inheritance: false
